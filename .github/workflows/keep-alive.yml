name: keep-alive

# Render's free tier spins the service down after 15 minutes without inbound traffic,
# and a cold start then adds ~30-50s to the next scan. Pinging /health every ~10 minutes
# keeps the instance warm so the first scan after a quiet period isn't the slow one.
#
# Note: GitHub's scheduled runs are best-effort and can be delayed a few minutes under
# load — harmless here, the 10-min cadence has margin against the 15-min spin-down.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://beatlink-api.onrender.com/health)
          echo "health status: $code"
          # A cold start can make the very first ping slow or 5xx while it boots — that's
          # expected and still wakes the instance, so don't fail the job on it.
